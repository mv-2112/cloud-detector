[project]
name = "cloud-detector"
version = "0.1.0"
description = "A clean container-safe cloud platform and runtime discovery tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
cloud-detect = "cloud_detector.cli:app"

[build-system]
requires = ["uv-build>=0.1.0"]
build-backend = "uv_build"

